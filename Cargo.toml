[package]
name = "chiki8"
version = "0.1.0"
edition = "2021"
description = "A configurable CHIP-8 emulator built with Rust and SDL2"
license = "MIT"
repository = "https://github.com/frogiraffe/chiki8"

[dependencies]
getopts = "0.2.21"
rand = "0.8.5"
sdl2 = "0.38"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
